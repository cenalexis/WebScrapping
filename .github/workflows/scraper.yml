name: CISE 2026 — Scraper automático

on:
  schedule:
    # 11:00 UTC = 06:00 Ecuador (UTC-5). Corre cada día.
    - cron: '0 11 * * *'
  workflow_dispatch:   # también se puede lanzar manualmente desde GitHub

permissions:
  contents: write      # necesario para crear/actualizar el release

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3 horas máximo (aumentar si se agregan más scrapers)

    env:
      CHROME_VER: "0"               # 0 = auto-detectar versión instalada
      DB_PATH: vacantes_laborales.db
      EXPORTS_DIR: exports
      GDRIVE_CREDENTIALS_PATH: credentials.json
      GDRIVE_TOKEN_PATH: token.json

    steps:
      # ── 1. Código ────────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      # ── 3. Chrome ────────────────────────────────────────────────────────────
      - name: Instalar Chrome estable
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 4. Recuperar BD anterior ─────────────────────────────────────────────
      - name: Descargar BD del release anterior
        run: |
          gh release download latest-data \
            --pattern "vacantes_laborales.db" \
            --dir . --clobber 2>/dev/null \
            && echo "BD descargada." \
            || echo "Primera ejecución — se crea una BD nueva."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ══════════════════════════════════════════════════════════════════════════
      # SCRAPERS  — agregar un bloque por cada portal nuevo
      # ══════════════════════════════════════════════════════════════════════════

      - name: Scraper — Multitrabajos
        run: python Notebooks/scraper_mt_v2.py
        continue-on-error: true

      - name: Pausa entre portales
        run: sleep 60

      - name: Scraper — Computrabajo
        run: python Notebooks/scraper_computrabajo.py
        continue-on-error: true

      # Ejemplo de cómo agregar el siguiente portal (descomentar cuando esté listo):
      # - name: Pausa entre portales
      #   run: sleep 60
      # - name: Scraper — SocioEmpleo
      #   run: python Notebooks/scraper_socioempleo.py
      #   continue-on-error: true

      # ══════════════════════════════════════════════════════════════════════════
      # EXPORTAR
      # ══════════════════════════════════════════════════════════════════════════

      - name: Exportar Excel + CSV
        run: python exportar_excel.py

      # ══════════════════════════════════════════════════════════════════════════
      # PUBLICAR — GitHub Release (siempre) + Google Drive (si hay token)
      # ══════════════════════════════════════════════════════════════════════════

      - name: Publicar en release latest-data (GitHub)
        run: |
          gh release view latest-data 2>/dev/null || \
            gh release create latest-data \
              --title "Datos CISE 2026 — última actualización" \
              --notes "Actualización automática. Descarga el .db, .xlsx o .csv." \
              --prerelease

          gh release upload latest-data \
            vacantes_laborales.db \
            exports/vacantes_*.xlsx \
            exports/vacantes_*.csv \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar credenciales Google Drive
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GDRIVE_TOKEN }}'       > token.json
        continue-on-error: true

      - name: Subir a Google Drive
        run: python subir_drive.py
        continue-on-error: true

      # ── Resumen visible en la pestaña Actions ─────────────────────────────────
      - name: Resumen
        run: |
          echo "### Datos publicados — $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Tamaño |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in vacantes_laborales.db exports/vacantes_*; do
            [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -sh $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 [Descargar datos](https://github.com/${{ github.repository }}/releases/tag/latest-data)" >> $GITHUB_STEP_SUMMARY
