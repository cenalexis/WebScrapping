name: CISE 2026 — Scraper automático

on:
  schedule:
    # 11:00 UTC = 06:00 Ecuador (UTC-5). Corre cada día.
    - cron: '0 11 * * *'
  workflow_dispatch:   # también se puede lanzar manualmente desde GitHub

permissions:
  contents: write      # necesario para crear/actualizar el release

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3 horas máximo (aumentar si se agregan más scrapers)

    env:
      DATABASE_URL:  ${{ secrets.DATABASE_URL }}
      EXPORTS_DIR:   exports
      GDRIVE_CREDENTIALS_PATH: credentials.json
      GDRIVE_TOKEN_PATH: token.json

    steps:
      # ── 1. Código ────────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      # ── Notificar inicio ──────────────────────────────────────────────────────
      - name: Notificar inicio
        if: ${{ secrets.NTFY_TOPIC != '' }}
        run: |
          curl -s -X POST \
            -H "Title: CISE 2026 — Scraping iniciado" \
            -H "Priority: low" -H "Tags: robot" \
            -d "Scraping diario iniciado: $(date '+%Y-%m-%d %H:%M UTC')" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
        continue-on-error: true

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      # ── 3. Chrome ────────────────────────────────────────────────────────────
      - name: Instalar Chrome estable
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ══════════════════════════════════════════════════════════════════════════
      # SCRAPERS  — agregan datos directamente en Supabase (PostgreSQL)
      # ══════════════════════════════════════════════════════════════════════════

      - name: Scraper — Multitrabajos
        run: python Notebooks/scraper_mt_v2.py
        continue-on-error: true

      - name: Pausa entre portales
        run: sleep 60

      - name: Scraper — Computrabajo
        run: python Notebooks/scraper_computrabajo.py
        continue-on-error: true

      # ══════════════════════════════════════════════════════════════════════════
      # CLASIFICACIÓN Y REVISIÓN — solo vacantes nuevas (filtro incremental);
      # cada paso es idempotente, así que un fallo aquí no bloquea al siguiente
      # ══════════════════════════════════════════════════════════════════════════

      - name: Instalar modelo de español para spaCy
        run: python -m spacy download es_core_news_sm

      - name: NLP — clasificación semántica (CIUO/CIIU/carreras)
        run: python Codes/nlp_pipeline.py
        continue-on-error: true

      - name: Corrector de anclas (1a pasada)
        run: python Codes/corregir_codigos.py
        continue-on-error: true

      - name: Palabras clave (key_words)
        run: python Codes/generar_keywords.py
        continue-on-error: true

      - name: Revisor IA — revisión con modelos de lenguaje
        run: python Codes/revisar_ia.py --max 0
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: true

      - name: Revisor IA — aplicar correcciones
        run: python Codes/revisar_ia.py --aplicar
        continue-on-error: true

      - name: Corrector de anclas (2a pasada)
        run: python Codes/corregir_codigos.py
        continue-on-error: true

      - name: Recalcular carreras
        run: python Codes/backfill_carreras.py
        continue-on-error: true

      - name: Generar dashboard
        run: python Codes/generar_dashboard.py --todo
        continue-on-error: true

      # ══════════════════════════════════════════════════════════════════════════
      # EXPORTAR
      # ══════════════════════════════════════════════════════════════════════════

      - name: Exportar Excel + CSV
        run: python exportar_excel.py

      # ══════════════════════════════════════════════════════════════════════════
      # PUBLICAR — GitHub Release + Google Drive
      # ══════════════════════════════════════════════════════════════════════════

      - name: Publicar exports en release latest-data (GitHub)
        run: |
          gh release view latest-data 2>/dev/null || \
            gh release create latest-data \
              --title "Datos CISE 2026 — última actualización" \
              --notes "Actualización automática. Descarga el .xlsx o .csv." \
              --prerelease

          gh release upload latest-data \
            exports/vacantes_*.xlsx \
            exports/vacantes_*.csv \
            exports/dashboard/CISE_Dashboard.html \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar credenciales Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          printf '%s' "$GDRIVE_CREDENTIALS" > credentials.json
          printf '%s' "$GDRIVE_TOKEN"       > token.json
        continue-on-error: true

      - name: Subir a Google Drive
        run: python subir_drive.py
        continue-on-error: true

      # ── Notificaciones finales ────────────────────────────────────────────────
      - name: Notificar éxito
        if: ${{ success() && secrets.NTFY_TOPIC != '' }}
        run: |
          TOTAL=$(python -c "
from db import conectar
conn = conectar()
cur = conn.cursor()
cur.execute('SELECT COUNT(*) FROM vacantes')
print(cur.fetchone()[0])
" 2>/dev/null || echo "?")
          NUEVAS_MT=$(python -c "
from db import conectar
conn = conectar()
cur = conn.cursor()
cur.execute(\"SELECT COALESCE(total_nuevas,0) FROM ejecuciones WHERE portal_id=(SELECT id FROM portales WHERE nombre='multitrabajos') ORDER BY id DESC LIMIT 1\")
r = cur.fetchone()
print(r[0] if r else 0)
" 2>/dev/null || echo "?")
          NUEVAS_CT=$(python -c "
from db import conectar
conn = conectar()
cur = conn.cursor()
cur.execute(\"SELECT COALESCE(total_nuevas,0) FROM ejecuciones WHERE portal_id=(SELECT id FROM portales WHERE nombre='computrabajo') ORDER BY id DESC LIMIT 1\")
r = cur.fetchone()
print(r[0] if r else 0)
" 2>/dev/null || echo "?")
          curl -s -X POST \
            -H "Title: CISE 2026 — Scraping completado ✅" \
            -H "Priority: default" -H "Tags: white_check_mark,chart_with_upwards_trend" \
            -d "$(date '+%Y-%m-%d') | Total BD: $TOTAL vacantes | Nuevas hoy: MT=$NUEVAS_MT CT=$NUEVAS_CT" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
        continue-on-error: true

      - name: Notificar fallo
        if: ${{ failure() && secrets.NTFY_TOPIC != '' }}
        run: |
          curl -s -X POST \
            -H "Title: CISE 2026 — ⚠️ Error en scraping" \
            -H "Priority: high" -H "Tags: warning,rotating_light" \
            -d "El workflow falló el $(date '+%Y-%m-%d'). Revisa: https://github.com/${{ github.repository }}/actions" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
        continue-on-error: true

      # ── Resumen visible en la pestaña Actions ─────────────────────────────────
      - name: Resumen
        run: |
          echo "### Datos publicados — $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Tamaño |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in exports/vacantes_*; do
            [ -f "$f" ] && echo "| \`$(basename $f)\` | $(du -sh $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 [Descargar datos](https://github.com/${{ github.repository }}/releases/tag/latest-data)" >> $GITHUB_STEP_SUMMARY
